name: Sync public project activity

on:
  schedule:
    # 10:11 Yangon time / 03:41 UTC
    - cron: '41 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-project-activity
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update public project metadata section
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/sync_project_activity.py
      - name: Commit only when metadata changes
        shell: bash
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes; skip commit."
            exit 0
          fi
          git config user.name "khantthuaung-kta"
          git config user.email "209433505+khantthuaung-kta@users.noreply.github.com"
          git commit -m "docs: sync real public project activity"
          git push origin HEAD:main
